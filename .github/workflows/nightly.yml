name: Nightly

# What changes without anyone touching this repository. Above all WWCP_POI.TS: its master moves on daily, and the
# validator follows it by hand (README, "The demos"). A red of 'wwcp-poi-ts-master' is the signal to do so: the analysis
# reads something the library no longer gives, or the demos made anew differ, as WWCP_POI.TS moved on to another recorded
# run or calculates other bytes. Then follow it, and pin the commit of WWCP_POI.TS that works in package.json.
#
# 'pinned' runs the gate once more: a change of the runner images or of Node reaches it on a day nobody pushed.
#
# Scheduled workflows run on the default branch only, and GitHub disables them after 60 days without any activity in
# the repository: if this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:17 UTC, after the nightly run of WWCP_POI.TS (02:47), and not on the hour, when GitHub's scheduler is busiest.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pinned:
    uses: ./.github/workflows/verify.yml
    with:
      leg: nightly-pinned

  wwcp-poi-ts-master:
    uses: ./.github/workflows/verify.yml
    with:
      wwcp-poi-ts: master
      leg: nightly-wwcp-poi-ts-master
